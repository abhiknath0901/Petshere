<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment - PetSphere</title>
   <style>
 
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BODY */
body{
    min-height:100vh;
    width:100%;
    background:linear-gradient(135deg,#f8f3e9,#e8d7c5);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:750px;
}

/* FORM CARD */
.form-card{
    width:100%;
    background:rgba(255,255,255,0.95);
    padding:40px;
    border-radius:28px;
    box-shadow:0 20px 45px rgba(62,39,35,0.12);
    animation:fadeUp 0.6s ease;
    position:relative;
    overflow:hidden;
}

.form-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:6px;
    background:linear-gradient(135deg,#8d6e63,#a1887f);
}

/* TITLE */
.form-card h2{
    text-align:center;
    margin-bottom:30px;
    color:#5d4037;
    font-size:2rem;
    font-weight:700;
    text-decoration:none;
}

/* LABEL */
label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    font-size:15px;
    color:#5d4037;
}

/* INPUTS */
input,
select,
textarea{
    width:100%;
    padding:14px 16px;
    margin-bottom:22px;
    border-radius:14px;
    border:2px solid #decab8;
    background:#fffaf4;
    font-size:15px;
    color:#4b2e1e;
    outline:none;
    transition:0.3s ease;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#8d6e63;
    background:#ffffff;
    box-shadow:0 0 10px rgba(141,110,99,0.15);
}

textarea{
    min-height:110px;
    resize:vertical;
}

/* BUTTON */
.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#8d6e63,#a1887f);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s ease;
}

.btn:hover{
    background:#5d4037;
    transform:translateY(-3px);
    box-shadow:0 12px 24px rgba(62,39,35,0.18);
}

/* ANIMATION */
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(35px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */
@media(max-width:768px){

body{
    padding:20px 12px;
}

.form-card{
    padding:28px 20px;
    border-radius:22px;
}

.form-card h2{
    font-size:1.6rem;
}

input,
select,
textarea{
    padding:12px 14px;
    font-size:14px;
}

.btn{
    font-size:16px;
    padding:14px;
}

}
   </style>
</head>
<body>

<div class="container">

    <form class="form-card">

        <h2><u>Book Appointment</u></h2>

        <label>Pet Owner Name</label>
        <input type="text" placeholder="Your Name" required>

        <label>Pet Name</label>
        <input type="text" placeholder="Your Pet’s Name" required>

        <label>Pet Type</label>
        <select required>
            <option value="">Select Pet</option>
            <option>Dog</option>
            <option>Cat</option>
            <option>Bird</option>
            <option>Rabbit</option>
            <option>Other</option>
        </select>

        <label>Select Vet</label>
        <select required>
            <option value="">Choose Vet</option>
            <option>Dr. Maria James</option>
            <option>Dr. Stephen Parker</option>
            <option>Dr. Rachel Smith</option>
        </select>

        <label>Date</label>
        <input type="date" required>

        <label>Time</label>
        <input type="time" required>

        <label>Describe the Issue</label>
        <textarea placeholder="Write briefly about your pet's condition..."></textarea>

        <button class="btn">Confirm Appointment</button>
    </form>

</div>

</body>
</html>
