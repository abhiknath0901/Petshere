<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetSphere Payment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --cream: #f8efe5;
            --light: #ead6c1;
            --brown: #bb8659;
            --dark: #7b5132;
            --deep: #4e3120;
            --glass: rgba(255, 255, 255, 0.78);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f6ede4, #ead7c3, #d9b18a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 22px;
        }

        .payment-container {
            width: 100%;
            max-width: 1400px;
            min-height: 90vh;
            display: grid;
            grid-template-columns: 38% 62%;
            overflow: hidden;
            border-radius: 30px;
            box-shadow: 0 25px 55px rgba(78, 49, 32, 0.15);
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
        }

        .left {
            background: linear-gradient(160deg, #7b5132, #5f3d27, #3d2418);
            color: white;
            padding: 50px 38px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .left h1 {
            font-size: 42px;
            margin-bottom: 18px;
        }

        .left p {
            font-size: 16px;
            line-height: 1.9;
            opacity: .95;
            max-width: 340px;
        }

        .right {
            background: var(--glass);
            backdrop-filter: blur(18px);
            padding: 45px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 28px;
            color: var(--deep);
            margin-bottom: 25px;
            font-weight: 600;
        }

        .order-summary {
            background: #fffaf6;
            border-radius: 22px;
            padding: 25px;
            border: 1.5px solid #e4c7aa;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #ead7c3;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .pet-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .pet-img {
            width: 65px;
            height: 65px;
            border-radius: 14px;
            object-fit: cover;
        }

        .pet-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--deep);
        }

        .pet-qty {
            font-size: 13px;
            color: #777;
        }

        .price {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
        }

        .total-box {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 20px;
            border-radius: 18px;
        }

        .total-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--deep);
        }

        .total-price {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
        }

        .payment-box {
            margin-top: 30px;
            background: #fffaf6;
            border-radius: 22px;
            padding: 25px;
            border: 1.5px dashed #c99d75;
        }

        .payment-box h3 {
            color: var(--deep);
            margin-bottom: 12px;
        }

        .payment-box p {
            color: #666;
            line-height: 1.8;
            font-size: 14px;
        }

        .pay-btn {
            width: 100%;
            border: none;
            margin-top: 30px;
            padding: 18px;
            border-radius: 18px;
            background: linear-gradient(135deg, #bb8659, #7b5132);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s ease;
        }

        .pay-btn:hover {
            transform: translateY(-3px);
        }

        .secure {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #666;
        }

        @media(max-width:900px) {

            .payment-container {
                grid-template-columns: 1fr;
            }

            .right {
                padding: 28px 20px;
            }

            .left {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="payment-container">

        <!-- LEFT -->
        <div class="left">

            <h1>PetSphere Payment</h1>

            <p>
                Complete your payment securely using Razorpay.
                Supports UPI, Cards and Net Banking.
            </p>

        </div>

        <!-- RIGHT -->
        <div class="right">

            <div class="section-title">
                Order Summary
            </div>

            <div class="order-summary" id="orderSummary">

            </div>

            <div class="total-box">

                <div class="total-text">
                    Total Amount
                </div>

                <div class="total-price" id="totalPrice">
                    ₹0
                </div>

            </div>

            <div class="payment-box">

                <h3>
                    Secure Checkout
                </h3>

                <p>
                    You will be redirected to Razorpay secure checkout.
                </p>

            </div>

            <button id="payBtn" class="pay-btn">
                Proceed To Pay
            </button>

            <div class="secure">
                🔒 Secure Payment Gateway
            </div>

        </div>

    </div>

    <!-- Razorpay -->
    <button id="rzp-button1">Pay</button>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>

    </script>
    <script src="config.js"></script>
    <script>

        function getCart() {

            return JSON.parse(
                localStorage.getItem("petCart") || "[]"
            );
        }

        function loadCart() {

            const cart = getCart();

            const orderSummary =
                document.getElementById("orderSummary");

            const totalPrice =
                document.getElementById("totalPrice");

            let total = 0;

            orderSummary.innerHTML = "";

            cart.forEach(item => {

                total += item.price * item.qty;

                orderSummary.innerHTML += `

        <div class="cart-item">

            <div class="pet-info">

                <img
                    src="${item.img}"
                    class="pet-img"
                >

                <div>

                    <div class="pet-name">
                        ${item.name}
                    </div>

                    <div class="pet-qty">
                        Qty: ${item.qty}
                    </div>

                </div>

            </div>

            <div class="price">
                ₹${item.price * item.qty}
            </div>

        </div>
        `;
            });

            totalPrice.textContent =
                `₹${total}`;
        }

        loadCart();

        document
            .getElementById("payBtn")
            .addEventListener("click", payNow);

        function payNow() {

            const cart = getCart();

            fetch(

                `${API_URL}/petshpere/create-payment/`,

                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${localStorage.getItem("access")
                            }`
                    },

                    body: JSON.stringify({
                        cart: cart
                    })
                }
            )

                .then(response => response.json())

                .then(data => {

                    const options = {

                        key: data.key,

                        amount:
                            data.payment.amount,

                        currency: "INR",

                        name: "PetSphere",

                        description:
                            "Pet Purchase",

                        order_id:
                            data.payment.id,

                        handler: function (payment) {

                            console.log(payment);

                            fetch(

                                `${API_URL}/petshpere/confirm-order/`,

                                {
                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            `Bearer ${localStorage.getItem("access")
                                            }`
                                    },
                                    body: JSON.stringify({
                                        razorpay_payment_id: payment.razorpay_payment_id,

                                        razorpay_order_id: payment.razorpay_order_id,

                                        razorpay_signature: payment.razorpay_signature,
                                        cart: getCart(),
                                        address_id: localStorage.getItem("selectedAddress")
                                    })
                                }
                            )

                                .then(res => res.json())

                                .then(orderData => {

                                    console.log(orderData);
                                    localStorage.setItem("orderdata", orderData);

                                    localStorage.removeItem(
                                        "petCart"
                                    );
                                    window.location.href = "payment successful.html";


                                });
                        },

                        theme: {
                            color: "#8d6e63"
                        }
                    };

                    const razorpay =
                        new Razorpay(options);

                    razorpay.open();
                })

                .catch(err => {

                    console.error(err);

                    alert("Payment Failed");
                });
        }

    </script>

</body>

</html>
