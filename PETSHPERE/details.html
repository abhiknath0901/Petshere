<!DOCTYPE html>
<html>
<head>
<title>Pet Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
  font-family:Poppins,sans-serif;
  background:#f8f3e9;
  margin:0;
}

/* ── TOP NAV BAR ── */
.topbar{
  background: linear-gradient(135deg, #8d6e63 0%, #a1887f 100%);
  padding:14px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 15px rgba(62,39,35,0.2);
}

.topbar a{
  color:white;
  text-decoration:none;
  font-size:14px;
  font-weight:500;
  display:flex;
  align-items:center;
  gap:6px;
  opacity:0.9;
  transition:opacity 0.2s;
}

.topbar a:hover{
  opacity:1;
}

/* CART */
.cart-link{
  position:relative;
  width:42px;
  height:42px;
  background:rgba(255,255,255,0.2);
  border:2px solid rgba(255,255,255,0.5);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  backdrop-filter:blur(4px);
  transition:background 0.3s;
}

.cart-link:hover{
  background:rgba(255,255,255,0.35);
}

#cartBadge{
  position:absolute;
  top:-6px;
  right:-6px;
  background:#e53935;
  color:#fff;
  font-size:11px;
  font-weight:700;
  width:20px;
  height:20px;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
  border:2px solid white;
}

/* MAIN CONTAINER */
.container{
  max-width:900px;
  margin:40px auto;
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

/* IMAGE */
.main-img{
  width:100%;
  height:400px;
  object-fit:contain;
  border-radius:10px;
}

/* GALLERY */
.gallery{
  display:flex;
  gap:10px;
  margin-top:10px;
  flex-wrap:wrap;
}

.gallery img{
  width:80px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer;
  border:2px solid transparent;
  transition:0.3s;
}

.gallery img:hover{
  border:2px solid #8d6e63;
  transform:scale(1.05);
}

/* TEXT */
h1{
  margin-top:15px;
}

.tags{
  margin-top:10px;
}

.tag{
  display:inline-block;
  padding:6px 12px;
  background:#eee;
  border-radius:15px;
  margin-right:6px;
  font-size:13px;
}

.price{
  font-size:26px;
  font-weight:bold;
  margin-top:15px;
  color:#5d4037;
}

/* SECTION */
.section{
  margin-top:20px;
  padding-top:10px;
  border-top:1px solid #eee;
}

.section h3{
  margin-bottom:6px;
  color:#6d4c41;
}

.section p{
  margin:0;
  color:#444;
  font-size:14px;
  line-height:1.6;
}

/* SELLER BOX */
.seller-box{
  background:#f1e7dd;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

/* ACTION BUTTONS */
.action-row{
  display:flex;
  gap:12px;
  margin-top:25px;
  flex-wrap:wrap;
}

.btn{
  flex:1;
  min-width:140px;
  padding:14px 20px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  font-size:15px;
  font-family:'Poppins',sans-serif;
  font-weight:600;
  transition:all 0.3s;
}

.btn-buy{
  background: linear-gradient(135deg, #8d6e63 0%, #a1887f 100%);
  color:#fff;
}

.btn-buy:hover{
  background:#6d4c41;
  transform:translateY(-2px);
}

.btn-cart{
  background: linear-gradient(135deg, #4caf50 0%, #66bb6a 100%);
  color:#fff;
}

.btn-cart:hover{
  background:#388e3c;
  transform:translateY(-2px);
}

.btn-cart.added{
  background: linear-gradient(135deg, #388e3c 0%, #2e7d32 100%);
}

</style>
</head>

<body>

<!-- TOP NAV -->
<div class="topbar">

  <a href="allpets.html">← Back to All Pets</a>

  <a class="cart-link" href="cart.html" title="View Cart">
    🛒
    <span id="cartBadge"></span>
  </a>

</div>

<div class="container">

  <img id="mainImg" class="main-img" alt="Pet Image">

  <div class="gallery" id="gallery"></div>

  <h1 id="name"></h1>

  <div class="tags">
    <span class="tag" id="type"></span>
    <span class="tag" id="age"></span>
    <span class="tag" id="gender"></span>
  </div>

  <p class="price" id="price"></p>

  <div class="section">
    <h3>Breed Information</h3>
    <p id="breedInfo"></p>
  </div>

  <div class="section">
    <h3>About Pet</h3>
    <p id="desc"></p>
  </div>

  <div class="section">
    <h3>Health & Vaccination</h3>
    <p id="health"></p>
  </div>

  <div class="section">
    <h3>Temperament</h3>
    <p id="behavior"></p>
  </div>

  <div class="section">
    <h3>Care Requirements</h3>
    <p id="care"></p>
  </div>

  <div class="section">
    <h3>Additional Information</h3>
    <p id="extra"></p>
  </div>

  <div class="section">
    <h3>Seller Details</h3>
    <div class="seller-box">
      <p id="seller"></p>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="action-row">

    <button class="btn btn-cart" id="addCartBtn" onclick="handleAddToCart()">
      🛒 Add to Cart
    </button>

    <button class="btn btn-buy" onclick="buy()">
      ⚡ Buy Now
    </button>

  </div>

</div>
<script src="config.js"></script>
<script src="petsdata.js"></script>
<script src="cart.js"></script>

<script>

// GET PET ID
const id = new URLSearchParams(window.location.search).get("id");

const pet = allPets.find(p => p.id == id);

// NOT FOUND
if(!pet){

  document.body.innerHTML = `
  
  <h2 style="text-align:center;margin-top:60px">
    Pet not found
  </h2>
  
  `;

  throw new Error("Pet not found");
}

// FILL DETAILS
document.getElementById("name").innerText = pet.name;

document.getElementById("mainImg").src = `${pet.img}`;

document.getElementById("type").innerText = pet.type;

document.getElementById("age").innerText = pet.age;

document.getElementById("gender").innerText = pet.gender;

document.getElementById("price").innerText =
"₹" + pet.price.toLocaleString();

document.getElementById("breedInfo").innerText =
pet.breedInfo || "Not specified";

document.getElementById("desc").innerText = pet.desc;

document.getElementById("health").innerText = pet.health;

document.getElementById("behavior").innerText = pet.behavior;

document.getElementById("care").innerText = pet.care;

document.getElementById("extra").innerText = pet.extra;

document.getElementById("seller").innerText = pet.seller;

// GALLERY
const gallery = document.getElementById("gallery");

if(pet.images && pet.images.length){

  pet.images.forEach(img => {

    const image = document.createElement("img");

    image.src = img;

    image.onclick = () => {

      document.getElementById("mainImg").src = img;

    };

    gallery.appendChild(image);

  });

}

// ADD TO CART
function handleAddToCart(){

  addToCart(pet);

  const btn = document.getElementById("addCartBtn");

  btn.textContent = "✓ Added to Cart!";

  btn.classList.add("added");

  setTimeout(() => {

    btn.textContent = "🛒 Add to Cart";

    btn.classList.remove("added");

  }, 2000);

}

// BUY NOW → ADDRESS PAGE
function buy(){
  addToCart(pet);


  // GO TO ADDRESS PAGE
  window.location.href = "address page.html";

}

</script>

</body>
</html>
