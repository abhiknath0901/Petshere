<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSphere Adoption Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f8f3e9;
    color:#4b2e1e;
    line-height:1.6;
    display:flex;
    flex-direction:column;
    min-height:100vh;
}

/* NAVBAR */
.navbar{
    background:linear-gradient(135deg,#8d6e63 0%,#a1887f 100%);
    padding:5px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 4px 15px rgba(62,39,35,0.15);
}

.logo-container{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
}

.logo-img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:contain;
}

.logo-text{
    font-size:28px;
    font-weight:700;
    color:white;
}

/* HERO */
.hero-header{
    text-align:center;
    padding:70px 20px 50px;
    background:linear-gradient(to right,#f8f1e7,#ead7c0);
}

.hero-header h1{
    font-size:42px;
    color:#5d4037;
    margin-bottom:12px;
}

.hero-header p{
    color:#6d5a50;
    font-size:18px;
}

/* PET GRID */
#petsContainer{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:30px;
    padding:30px 8% 70px;
}

.pet-card{
    background:#ffffff;
    border-radius:22px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 15px 35px rgba(62,39,35,0.12);
    transition:0.4s ease;
    border:1px solid rgba(141,110,99,0.15);
}

.pet-card:hover{
    transform:translateY(-12px);
    box-shadow:0 18px 40px rgba(62,39,35,0.22);
}

.pet-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    transition:0.5s;
}

.pet-card:hover img{
    transform:scale(1.08);
}

.pet-info{
    padding:20px;
    text-align:center;
}

.pet-info h3{
    font-size:24px;
    color:#5d4037;
    margin-bottom:8px;
}

.pet-info p{
    color:#8a766b;
    font-size:15px;
}

/* DETAIL PAGE */
.detail-wrapper{
    max-width:900px;
    margin:40px auto;
    padding:0 20px;
}

.hidden{
    display:none;
}

.detail-card{
    background:#ffffff;
    padding:35px;
    border-radius:28px;
    box-shadow:0 20px 45px rgba(62,39,35,0.12);
    animation:fadeInUp .6s ease;
}

.detail-card img{
    width:100%;
    max-height:450px;
    object-fit:cover;
    border-radius:20px;
    margin-bottom:25px;
}

.detail-card h2{
    font-size:38px;
    color:#5d4037;
    margin-bottom:10px;
}

.detail-card p{
    font-size:16px;
    color:#5f5248;
}

/* QUICK CONTACT BOX */
.quick-box{
    margin:25px 0;
    padding:18px;
    background:#f8f3e9;
    border-radius:18px;
    border:2px dashed #a1887f;
}

/* BUTTONS */
.back-btn{
    padding:13px 30px;
    background:linear-gradient(135deg,#8d6e63 0%,#a1887f 100%);
    color:white;
    border:none;
    border-radius:30px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    margin-bottom:20px;
}

.back-btn:hover{
    background:#5d4037;
    transform:translateY(-3px);
}

.adopt-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#8d6e63 0%,#a1887f 100%);
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    margin-top:20px;
}

.adopt-btn:hover{
    background:#5d4037;
    transform:translateY(-3px);
}

/* FOOTER */
footer{
    margin-top:auto;
    background:#5d4037;
    color:#f8f3e9;
    text-align:center;
    padding:28px;
    font-size:15px;
}

/* ANIMATION */
@keyframes fadeInUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */
@media(max-width:768px){

.hero-header h1{
    font-size:30px;
}

.hero-header p{
    font-size:16px;
}

.logo-text{
    font-size:22px;
}

#petsContainer{
    padding:20px;
    gap:22px;
}

.detail-card{
    padding:22px;
}

.detail-card h2{
    font-size:28px;
}

}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-container">
            <img src="images/logo3.png" alt="PetSphere Logo" class="logo-img">
            <span class="logo-text">PetSphere</span>
        </div>
    </nav>

    <main>
        <header class="hero-header fade-in">
            <h1>Find Your Forever Friend</h1>
            <p>Click a pet to view their unique story and details</p>
        </header>

        <section id="listView">
            <div id="petsContainer" class="fade-in"></div>
        </section>

        <section id="detailView" class="hidden">
            <div class="detail-wrapper">
                <button onclick="goBack()" class="back-btn">⬅ Back to Gallery</button>
                <div id="petDetail"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="copyright">
            &copy; PetSphere | All Rights Reserved.
        </div>
    </footer>

    <script>
        const pets = [
            {
                name: "Max",
                type: "Dog",
                age: "2 years",
                location: "Kolkata",
                description: "Friendly and playful dog who loves children and is fully house trained. He is fully vaccinated and looking for a loving home.",
                image: "images/max(2).webp"
            },
            {
                name: "Luna",
                type: "Persian Cat",
                age: "1 year",
                location: "Howrah",
                description: "Calm and affectionate cat who enjoys naps. Luna is perfect for apartment living and is fully litter trained.",
                image: "images/luna(2).jpeg"
            },
            {
                name: "Nova and Clein",
                type: "LoveBirds",
                age: "8 months",
                location: "Kolkata",
                description: "Lovebirds are small, colorful parrots with beautiful feathers and a playful nature.",
                image: "images/clein.jpeg"
            },
            {
                name: "Loonie",
                type: "Rabbit",
                age: "3 years",
                location: "Durgapur",
                description: "Loonie loves cuddles and quiet corners, very gentle with children.",
                image: "images/loonie 1.webp"
            },
            {
                name: "Rocky",
                type: "Dog",
                age: "4 years",
                location: "Kolkata",
                description: "Strong and loyal guard dog, very protective and friendly with family.",
                image: "images/rocky (1).webp"
            },
            {
                name: "Cookie",
                type: "Hamster",
                age: "10 months",
                location: "Salt Lake, Kolkata",
                description: "Cookie is a small, playful hamster who loves running, exploring, and storing treats in her cheeks. She is healthy, active, and Vet Checked.",
                image: "images/hamster(1).webp"
            },
            {
                name: "Sweety",
                type: "Parrot",
                age: "1 year",
                location: "Siliguri",
                description: "Sweety is a vibrant, intelligent companion who will fill your home with cheerful chatter and rhythmic charm. She has a lifespan of 10-20 years, size 5-7 inches, and enjoys fresh fruits and veggies.",
                image: "images/parrot(2).jpg"
            }
        ];

        const container = document.getElementById("petsContainer");
        const detailView = document.getElementById("detailView");
        const listView = document.getElementById("listView");
        const petDetail = document.getElementById("petDetail");

        function loadPets() {
            container.innerHTML = "";
            pets.forEach((pet, index) => {
                container.innerHTML += `
                    <div class="pet-card" onclick="showDetail(${index})">
                        <img src="${pet.image}" alt="${pet.name}">
                        <div class="pet-info">
                            <h3>${pet.name}</h3>
                            <p>${pet.type}</p>
                        </div>
                    </div>
                `;
            });
        }

        function showDetail(index) {
            const pet = pets[index];
            petDetail.innerHTML = `
                <div class="detail-card">
                    <img src="${pet.image}" alt="${pet.name}">
                    <h2>${pet.name}</h2>
                    
                    <div style="margin: 15px 0;">
                        <p><strong>Type:</strong> ${pet.type}</p>
                        <p><strong>Age:</strong> ${pet.age}</p>
                        <p><strong>Location:</strong> ${pet.location}</p>
                    </div>

                    <p style="margin-bottom: 20px;"> ${pet.description}</p>

                    <div style="margin: 20px 0; padding: 15px; background: #fdf2e4; border-radius: 15px; border: 1px dashed #8b5e3c; text-align: left;">
                        <h4 style="color: #5c3b28; margin-bottom: 10px;">Quick Contact</h4>
                        <p style="font-size: 14px; margin: 5px 0;"> Phone: +91 98765 43210</p>
                        <p style="font-size: 14px; margin: 5px 0;"> Email: adoption@petsphere.com</p>
                        <p style="font-size: 14px; margin: 5px 0;">Visit: Park Street, Kolkata</p>
                    </div>

                    <button class="back-btn" onclick="adopt('${pet.name}')" style="width: 100%; font-size: 18px;">
                        Adopt ${pet.name}
                    </button>
                </div>
            `;

            listView.classList.add("hidden");
            detailView.classList.remove("hidden");
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function goBack() {
            detailView.classList.add("hidden");
            listView.classList.remove("hidden");
        }

        function adopt(name) {
            alert("Adoption request sent for " + name + "  \n\nOur PetSphere team will contact you within 24 hours!");
        }

        loadPets();
    </script>
</body>
</html>
